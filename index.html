<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三羊开泰 🐑</title>
<style>
  :root{
    --bg1:#a8e6cf; --bg2:#dcedc1; --accent:#ff8b94; --accent2:#ffd3b6;
    --slot:#fff8e7; --slotbd:#f0c987; --card:#ffffff; --shadow:rgba(80,50,20,.28);
    --ink:#5a4632;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,#ffe9c7 0%,#a8e6cf 55%,#b8c6ff 100%);
    color:var(--ink);overflow:hidden;user-select:none;
    display:flex;align-items:center;justify-content:center;
  }
  #app{
    width:100%;max-width:480px;height:100%;max-height:920px;
    display:flex;flex-direction:column;position:relative;
    padding:8px 10px 12px;
  }

  /* ---------- Top bar ---------- */
  #topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 2px;}
  .stat{
    background:rgba(255,255,255,.7);border-radius:14px;padding:6px 10px;
    font-weight:700;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.06);
    display:flex;align-items:center;gap:4px;min-width:64px;justify-content:center;
  }
  .stat small{font-weight:600;opacity:.6;font-size:10px;}
  #lvlName{flex:1;text-align:center;font-size:15px;font-weight:800;color:#e9657b;
    text-shadow:0 1px 0 #fff;}

  /* ---------- Board ---------- */
  #boardWrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  #board{position:relative;transform-origin:center center;}
  .card{
    position:absolute;border-radius:12px;background:var(--card);
    display:flex;align-items:center;justify-content:center;
    border:2px solid #f3e7d4;cursor:pointer;
    box-shadow:2px 4px 0 var(--shadow);
    transition:transform .12s ease, opacity .18s ease, top .25s, left .25s;
    will-change:transform;
  }
  .card .face{font-size:30px;line-height:1;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12));}
  .card.covered{cursor:default;}
  .card::after{
    content:"";position:absolute;inset:0;border-radius:10px;
    background:rgba(40,30,15,.42);pointer-events:none;opacity:0;transition:opacity .25s ease;
  }
  .card.covered::after{opacity:1;}
  .card:not(.covered):active{transform:scale(.9);}
  .card.pop{animation:pop .22s cubic-bezier(.34,1.4,.5,1);}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(.84);}100%{transform:scale(1);}}
  /* flying card from board to slot */
  .flyer{
    position:fixed;z-index:5000;display:flex;align-items:center;justify-content:center;
    background:#fff;border:2px solid #f3e7d4;border-radius:12px;box-shadow:2px 6px 10px rgba(80,50,20,.3);
    pointer-events:none;transform-origin:center;
    transition:transform .34s cubic-bezier(.45,.05,.25,1), opacity .12s ease;
  }
  .flyer span{line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12));}
  .card.hintGlow{animation:hintGlow .7s ease infinite;}
  @keyframes hintGlow{0%,100%{box-shadow:2px 4px 0 var(--shadow);}50%{box-shadow:0 0 0 4px #ffe24d,2px 4px 0 var(--shadow);}}

  /* ---------- Slots ---------- */
  #slotsArea{margin-top:6px;}
  #slots{
    display:flex;gap:5px;justify-content:center;
    background:linear-gradient(#ffe9b0,#f7d489);
    border-radius:18px;padding:8px 8px;box-shadow:inset 0 3px 8px rgba(150,90,20,.25),0 3px 0 #d9a94f;
  }
  .slot{
    width:42px;height:50px;border-radius:10px;background:var(--slot);
    border:2px dashed var(--slotbd);display:flex;align-items:center;justify-content:center;
    font-size:26px;position:relative;flex:0 0 auto;
  }
  .slot.filled{border-style:solid;background:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
  .slot .sface{line-height:1;will-change:transform;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12));}
  .slot .sface.landed{animation:landBounce .3s cubic-bezier(.34,1.5,.5,1);}
  @keyframes landBounce{0%{transform:scale(.6);}55%{transform:scale(1.18);}100%{transform:scale(1);}}
  .slot .sface.clearOut{animation:clearOut .34s cubic-bezier(.5,-0.2,.4,1) forwards;}
  @keyframes clearOut{0%{transform:scale(1);}38%{transform:scale(1.35) rotate(-10deg);}100%{transform:scale(0) rotate(28deg);opacity:0;}}
  .slot.flash{animation:slotFlash .34s ease;}
  @keyframes slotFlash{0%,100%{background:#fff;}45%{background:#fff6c2;box-shadow:0 0 0 3px #ffe24d inset;}}

  /* ---------- Props ---------- */
  #props{display:flex;gap:8px;justify-content:center;margin-top:12px;}
  .prop{
    background:rgba(255,255,255,.85);border:none;border-radius:16px;padding:8px 4px;
    width:74px;display:flex;flex-direction:column;align-items:center;gap:2px;
    box-shadow:0 3px 0 rgba(0,0,0,.12);cursor:pointer;font-family:inherit;
    position:relative;transition:transform .1s;
  }
  .prop:active{transform:translatey(2px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
  .prop .pico{font-size:22px;}
  .prop .pname{font-size:11px;font-weight:700;color:var(--ink);}
  .prop .badge{
    position:absolute;top:-6px;right:-6px;background:#ff5a5a;color:#fff;
    font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }
  .prop .badge.ad{background:#4caf50;}

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute;inset:0;background:rgba(40,30,40,.55);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;
  }
  .overlay.hidden{display:none;}
  .panel{
    background:linear-gradient(#fffdf6,#ffe9c7);border-radius:26px;padding:24px 22px;
    width:100%;max-width:330px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.3);
    border:3px solid #fff;animation:panelIn .35s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes panelIn{0%{transform:scale(.7) translateY(20px);opacity:0;}100%{transform:none;opacity:1;}}
  .panel h1{font-size:30px;color:#e9657b;text-shadow:0 2px 0 #fff;margin-bottom:6px;}
  .panel .sub{font-size:14px;opacity:.75;margin-bottom:14px;}
  .panel .big{font-size:54px;margin:6px 0 10px;}
  .btn{
    display:block;width:100%;border:none;border-radius:16px;padding:13px;margin:8px 0;
    font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .1s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .btn.primary{background:linear-gradient(#ff9a6b,#ff6f91);}
  .btn.green{background:linear-gradient(#7ed957,#4caf50);}
  .btn.blue{background:linear-gradient(#6bc8ff,#4d8bff);}
  .btn.ghost{background:linear-gradient(#cdb9a3,#b39b80);}

  /* level select */
  #levelGrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0;}
  .lvlBtn{
    width:64px;height:64px;border-radius:18px;border:none;font-family:inherit;
    font-size:22px;font-weight:800;color:#fff;cursor:pointer;position:relative;
    background:linear-gradient(#ffb16b,#ff7e9d);box-shadow:0 4px 0 rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;
  }
  .lvlBtn.locked{background:linear-gradient(#cfc4b6,#a89c8b);cursor:not-allowed;}
  .lvlBtn .lock{position:absolute;font-size:14px;bottom:3px;right:5px;}
  .lvlBtn small{position:absolute;top:3px;left:6px;font-size:9px;opacity:.85;font-weight:600;}

  /* start screen sheep */
  #startSheep{font-size:74px;animation:bob 2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-10px) rotate(3deg);}}

  /* particles */
  #fx{position:absolute;inset:0;pointer-events:none;z-index:900;overflow:hidden;}
  .pt{position:absolute;font-size:18px;will-change:transform,opacity;}

  /* toast */
  #toast{
    position:absolute;left:50%;top:46%;transform:transl(-50%,-50%);
    background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:14px;
    font-weight:700;font-size:14px;z-index:1500;opacity:0;transition:opacity .2s;
    pointer-events:none;white-space:nowrap;transform:translateX(-50%);
  }
  #toast.show{opacity:1;}

  .muteBtn{background:rgba(255,255,255,.7);border:none;border-radius:50%;width:34px;height:34px;
    font-size:16px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.08);}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="stat" id="timeStat"><small>⏱</small><span id="time">00:00</span></div>
    <div id="lvlName">三羊开泰</div>
    <div class="stat" id="moveStat"><small>步</small><span id="moves">0</span></div>
    <button class="muteBtn" id="muteBtn" title="音效">🔊</button>
  </div>

  <div id="boardWrap">
    <div id="board"></div>
    <div id="fx"></div>
  </div>

  <div id="slotsArea">
    <div id="slots"></div>
  </div>

  <div id="props">
    <button class="prop" data-prop="hint"><span class="pico">💡</span><span class="pname">提示</span><span class="badge" id="b-hint">3</span></button>
    <button class="prop" data-prop="undo"><span class="pico">↩️</span><span class="pname">撤回</span><span class="badge" id="b-undo">3</span></button>
    <button class="prop" data-prop="shuffle"><span class="pico">🔀</span><span class="pname">洗牌</span><span class="badge" id="b-shuffle">1</span></button>
    <button class="prop" data-prop="takeout"><span class="pico">💣</span><span class="pname">移出</span><span class="badge" id="b-takeout">1</span></button>
  </div>

  <div id="toast"></div>

  <!-- Start screen -->
  <div class="overlay" id="startScreen">
    <div class="panel">
      <div id="startSheep">🐑</div>
      <h1>三羊开泰</h1>
      <div class="sub">点点叠叠，三个一消，羊羊得意！</div>
      <button class="btn primary" id="playBtn">开始游戏 ▶</button>
      <button class="btn blue" id="selectBtn">选择关卡</button>
      <div class="sub" style="margin-top:10px;font-size:12px;">只点最上层 · 凑齐3个相同即消除</div>
    </div>
  </div>

  <!-- Level select -->
  <div class="overlay hidden" id="levelScreen">
    <div class="panel">
      <h1 style="font-size:24px;">选择关卡</h1>
      <div id="levelGrid"></div>
      <button class="btn ghost" id="backBtn">返回</button>
    </div>
  </div>

  <!-- End modal -->
  <div class="overlay hidden" id="endScreen">
    <div class="panel">
      <div class="big" id="endIcon">🎉</div>
      <h1 id="endTitle">通关啦！</h1>
      <div class="sub" id="endSub"></div>
      <button class="btn green" id="nextBtn">下一关 ➡</button>
      <button class="btn primary" id="retryBtn">再来一局 🔄</button>
      <button class="btn blue" id="shareBtn">分享成绩 📤</button>
      <button class="btn ghost" id="homeBtn">关卡选择</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ===================== 关卡配置（JSON 可扩展） ===================== */
const ICON_POOL = ["🐑","🍎","🍊","🍇","🍓","🍉","🥕","🌽","🍄","🐱","🐶","🐰","🌻","⭐","🍔","🍕","🎁","🧀","🌸","🦴"];
const LEVELS = [
  {name:"第1关 · 暖场",  layers:3, count:18, icons:6,  area:[300,300]},
  {name:"第2关 · 进阶",  layers:5, count:36, icons:9,  area:[330,320]},
  {name:"第3关 · 烧脑",  layers:7, count:60, icons:12, area:[350,340]},
  {name:"第4关 · 地狱",  layers:9, count:90, icons:15, area:[360,350]},
];
const CARD = 54, SLOT_MAX = 7, COVER = CARD*0.86, HALF = CARD/2;

/* ===================== 状态 ===================== */
let state = null;       // 当前关卡运行态
let curLevel = 0;
let timer = null, seconds = 0, started = false;
let history = [];       // 撤回快照
let muted = false;
let props = {hint:3, undo:3, shuffle:1, takeout:1};

const $ = id => document.getElementById(id);
const boardEl = $("board"), slotsEl = $("slots"), fxEl = $("fx");

/* ===================== 音效 (WebAudio) ===================== */
let actx=null;
function beep(freq,dur,type="sine",vol=.18){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=freq;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sfx={
  click:()=>beep(560,.08,"triangle",.15),
  place:()=>beep(420,.07,"sine",.12),
  clear:()=>{beep(660,.1,"triangle",.2);setTimeout(()=>beep(880,.12,"triangle",.2),90);setTimeout(()=>beep(1100,.16,"triangle",.2),190);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,"triangle",.22),i*140));},
  lose:()=>{[400,330,260].forEach((f,i)=>setTimeout(()=>beep(f,.3,"sawtooth",.18),i*160));},
  prop:()=>beep(720,.1,"square",.13),
};

/* ===================== 关卡生成 ===================== */
function buildLevel(idx){
  const cfg = LEVELS[idx];
  const [W,H] = cfg.area;
  // 1. 生成牌堆（每种 3 的倍数，保证可解性）
  const triples = cfg.count/3;
  const pool = ICON_POOL.slice(0, cfg.icons);
  const deck = [];
  for(let t=0;t<triples;t++){
    const icon = pool[Math.floor(Math.random()*pool.length)];
    deck.push(icon,icon,icon);
  }
  // 洗牌
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}

  // 2. 生成位置（多层堆叠）
  const cards=[];
  const maxX = W-CARD, maxY = H-CARD;
  const cols = Math.floor(maxX/HALF), rows = Math.floor(maxY/HALF);
  for(let i=0;i<cfg.count;i++){
    const layer = Math.floor(Math.random()*cfg.layers);
    const offX = (layer*11)%HALF, offY = (layer*13)%HALF;
    let x = Math.min(maxX, (Math.floor(Math.random()*cols))*HALF + offX);
    let y = Math.min(maxY, (Math.floor(Math.random()*rows))*HALF + offY);
    cards.push({id:i, icon:deck[i], x, y, layer, removed:false});
  }
  return {cfg, W, H, cards, slots:[]};
}

/* ===================== 覆盖判定 ===================== */
function isCovered(c, cards){
  for(const o of cards){
    if(o.removed || o===c) continue;
    if(o.layer > c.layer && Math.abs(o.x-c.x)<COVER && Math.abs(o.y-c.y)<COVER) return true;
  }
  return false;
}

/* ===================== 渲染 ===================== */
function renderBoard(){
  boardEl.innerHTML="";
  boardEl.style.width = state.W+"px";
  boardEl.style.height = state.H+"px";
  // 按层排序，保证 DOM 叠放正确
  const sorted=[...state.cards].sort((a,b)=>a.layer-b.layer);
  for(const c of sorted){
    if(c.removed) continue;
    const el=document.createElement("div");
    el.className="card";
    el.style.width=CARD+"px";el.style.height=CARD+"px";
    el.style.left=c.x+"px";el.style.top=c.y+"px";
    el.style.zIndex=c.layer*100 + c.id%100;
    el.innerHTML=`<span class="face">${c.icon}</span>`;
    c.el=el;
    el.addEventListener("click",()=>onCardClick(c));
    boardEl.appendChild(el);
  }
  refreshCovered();
  fitBoard();
}
function refreshCovered(){
  for(const c of state.cards){
    if(c.removed||!c.el) continue;
    if(isCovered(c,state.cards)) c.el.classList.add("covered");
    else c.el.classList.remove("covered");
  }
}
function renderSlots(newUid){
  // FLIP: 记录旧位置 → 重建 → 让已有牌平滑滑动到新位置
  const old={};
  slotsEl.querySelectorAll(".sface").forEach(f=>{ old[f.dataset.uid]=f.getBoundingClientRect(); });
  slotsEl.innerHTML="";
  for(let i=0;i<SLOT_MAX;i++){
    const cell=document.createElement("div");
    cell.className="slot";
    const item=state.slots[i];
    if(item){
      cell.classList.add("filled");
      const f=document.createElement("span");
      f.className="sface";f.dataset.uid=item.uid;f.textContent=item.icon;
      if(item.uid===newUid) f.style.visibility="hidden"; // 飞行落地后再显示
      cell.appendChild(f);
    }
    slotsEl.appendChild(cell);
  }
  // 反演并播放
  slotsEl.querySelectorAll(".sface").forEach(f=>{
    const o=old[f.dataset.uid];
    if(!o) return;
    const n=f.getBoundingClientRect();
    const dx=o.left-n.left, dy=o.top-n.top;
    if(dx||dy){
      f.style.transition="none";
      f.style.transform=`translate(${dx}px,${dy}px)`;
      requestAnimationFrame(()=>{
        f.style.transition="transform .28s cubic-bezier(.3,.9,.35,1.15)";
        f.style.transform="";
      });
    }
  });
}
function fitBoard(){
  const wrap=$("boardWrap");
  const pad=16;
  const sw=(wrap.clientWidth-pad)/state.W;
  const sh=(wrap.clientHeight-pad)/state.H;
  const scale=Math.min(sw,sh,1.5);
  boardEl.style.transform=`scale(${scale})`;
}
window.addEventListener("resize",()=>{if(state)fitBoard();});

/* ===================== 点击卡牌 ===================== */
let busy=false, slotUid=0;
function computeInsertIndex(icon){
  // 同类聚拢：插到最后一个同类之后，否则追加到末尾
  let idx=-1;
  for(let i=state.slots.length-1;i>=0;i--){ if(state.slots[i].icon===icon){idx=i;break;} }
  return idx===-1 ? state.slots.length : idx+1;
}
function onCardClick(c){
  if(busy || c.removed || !c.el) return;
  if(isCovered(c,state.cards)) return;
  if(state.slots.length>=SLOT_MAX) return;
  startTimer();
  pushHistory();
  sfx.click();
  clearHint();
  busy=true;
  c.removed=true;
  state.moves=(state.moves||0)+1;
  $("moves").textContent=state.moves;

  const uid=++slotUid;
  const idx=computeInsertIndex(c.icon);
  state.slots.splice(idx,0,{icon:c.icon,uid});

  const startRect=c.el.getBoundingClientRect();
  const icon=c.icon;
  c.el.classList.add("pop");
  // 让下层牌平滑露出，并在弹一下后移除台面牌
  setTimeout(()=>{ if(c.el){c.el.remove();c.el=null;} refreshCovered(); },90);

  // 先重排槽位（新牌隐藏），再让卡牌飞过去落地
  renderSlots(uid);
  flyToSlot(startRect, icon, uid, ()=>{
    sfx.place();
    busy=false;        // 落地后先释放
    resolveSlots();    // 若凑成三连会再次上锁
  });
}
function flyToSlot(startRect, icon, uid, done){
  const face=slotsEl.querySelector('.sface[data-uid="'+uid+'"]');
  if(!face){ done&&done(); return; }
  const er=face.getBoundingClientRect();
  const flyer=document.createElement("div");
  flyer.className="flyer";
  flyer.style.left=startRect.left+"px";
  flyer.style.top=startRect.top+"px";
  flyer.style.width=startRect.width+"px";
  flyer.style.height=startRect.height+"px";
  flyer.innerHTML=`<span style="font-size:${startRect.width*0.55}px">${icon}</span>`;
  document.body.appendChild(flyer);
  const dx=(er.left+er.width/2)-(startRect.left+startRect.width/2);
  const dy=(er.top+er.height/2)-(startRect.top+startRect.height/2);
  const sc=er.width/startRect.width;
  let finished=false;
  const finish=()=>{
    if(finished) return; finished=true;
    flyer.remove();
    if(face){ face.style.visibility="visible"; face.classList.add("landed"); }
    done&&done();
  };
  requestAnimationFrame(()=>{ flyer.style.transform=`translate(${dx}px,${dy}px) scale(${sc})`; });
  flyer.addEventListener("transitionend",e=>{ if(e.propertyName==="transform") finish(); });
  setTimeout(finish,420); // 兜底
}
function resolveSlots(){
  const count={};
  state.slots.forEach(s=>count[s.icon]=(count[s.icon]||0)+1);
  let target=null;
  for(const ic in count){ if(count[ic]>=3){ target=ic; break; } }
  if(target){
    busy=true;
    sfx.clear();
    const uids=[]; let n=0;
    state.slots.forEach(s=>{ if(s.icon===target && n<3){ uids.push(s.uid); n++; } });
    uids.forEach(uid=>{
      const f=slotsEl.querySelector('.sface[data-uid="'+uid+'"]');
      if(f){ f.classList.add("clearOut"); f.parentElement.classList.add("flash"); spawnParticles(f.parentElement); }
    });
    setTimeout(()=>{
      state.slots=state.slots.filter(s=>!uids.includes(s.uid));
      renderSlots();          // FLIP：剩余牌平滑左移补位
      busy=false;
      checkEnd();
    },340);
  }else{
    checkEnd();
  }
}
function checkEnd(){
  const remain=state.cards.filter(c=>!c.removed).length;
  if(remain===0 && state.slots.length===0){ win(); return; }
  if(state.slots.length>=SLOT_MAX){ lose(); return; }
}

/* ===================== 撤回快照 ===================== */
function pushHistory(){
  history.push({
    cards: state.cards.map(c=>({id:c.id,icon:c.icon,removed:c.removed})),
    slots: state.slots.map(s=>({...s})),
    moves: state.moves||0
  });
  if(history.length>50) history.shift();
}
function doUndo(){
  if(props.undo<=0){ adGain("undo"); return; }
  if(history.length===0){ toast("没有可撤回的操作"); return; }
  const snap=history.pop();
  const map={};snap.cards.forEach(s=>map[s.id]=s);
  state.cards.forEach(c=>{c.icon=map[c.id].icon;c.removed=map[c.id].removed;});
  state.slots=snap.slots.map(s=>({...s}));
  state.moves=snap.moves;
  $("moves").textContent=state.moves;
  props.undo--; updateBadges();
  sfx.prop();
  renderBoard(); renderSlots();
}

/* ===================== 道具 ===================== */
function doHint(){
  if(props.hint<=0){ adGain("hint"); return; }
  clearHint();
  // 优先：槽里已有 1~2 个的图标，且台面有可点的同类
  const slotCount={};state.slots.forEach(s=>slotCount[s.icon]=(slotCount[s.icon]||0)+1);
  const tops=state.cards.filter(c=>!c.removed && c.el && !isCovered(c,state.cards));
  if(tops.length===0){ toast("没有可点的牌，试试洗牌"); return; }
  let best=null,bestScore=-1;
  for(const c of tops){
    const s=slotCount[c.icon]||0;
    const sameTop=tops.filter(t=>t.icon===c.icon).length;
    const score=s*10+sameTop;
    if(score>bestScore){bestScore=score;best=c;}
  }
  if(best){
    best.el.classList.add("hintGlow");
    best._hint=true;
    props.hint--; updateBadges(); sfx.prop();
    setTimeout(clearHint,2500);
  }
}
function clearHint(){
  state && state.cards.forEach(c=>{if(c.el)c.el.classList.remove("hintGlow");c._hint=false;});
}
function doShuffle(){
  if(props.shuffle<=0){ adGain("shuffle"); return; }
  const remain=state.cards.filter(c=>!c.removed);
  const icons=remain.map(c=>c.icon);
  for(let i=icons.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[icons[i],icons[j]]=[icons[j],icons[i]];}
  remain.forEach((c,i)=>c.icon=icons[i]);
  props.shuffle--; updateBadges(); sfx.prop();
  pushHistory();
  renderBoard();
  toast("已重新洗牌 🔀");
}
function doTakeout(){
  if(props.takeout<=0){ adGain("takeout"); return; }
  if(state.slots.length===0){ toast("槽位是空的"); return; }
  pushHistory();
  // 取出槽位前 3 张（或全部）放回台面顶层
  const take=state.slots.splice(0, Math.min(3,state.slots.length));
  const baseLayer=Math.max(...state.cards.map(c=>c.layer),0)+1;
  let nid=Math.max(...state.cards.map(c=>c.id))+1;
  const maxX=state.W-CARD, maxY=state.H-CARD;
  take.forEach((item,i)=>{
    state.cards.push({id:nid++,icon:item.icon,
      x:Math.min(maxX,40+i*(CARD+8)), y:Math.min(maxY,maxY-CARD*0.2),
      layer:baseLayer+i, removed:false});
  });
  props.takeout--; updateBadges(); sfx.prop();
  renderBoard(); renderSlots();
  toast("移出 3 张到台面 💣");
}
function adGain(prop){
  // 模拟“看广告获得”
  showAd(()=>{ props[prop]+=1; updateBadges(); toast("观看广告 +1 道具 🎁"); });
}
function updateBadges(){
  ["hint","undo","shuffle","takeout"].forEach(p=>{
    const b=$("b-"+p);
    if(props[p]>0){ b.textContent=props[p]; b.classList.remove("ad"); }
    else{ b.textContent="AD"; b.classList.add("ad"); }
  });
}

/* ===================== 粒子特效 ===================== */
function spawnParticles(node){
  const r=node.getBoundingClientRect();
  const wrap=$("app").getBoundingClientRect();
  const cx=r.left-wrap.left+r.width/2, cy=r.top-wrap.top+r.height/2;
  const emojis=["✨","⭐","💫","🌟","🎉"];
  for(let i=0;i<10;i++){
    const p=document.createElement("div");
    p.className="pt";p.textContent=emojis[i%emojis.length];
    p.style.left=cx+"px";p.style.top=cy+"px";
    fxEl.appendChild(p);
    const ang=Math.random()*Math.PI*2, dist=30+Math.random()*55;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-20;
    p.animate([
      {transform:"translate(-50%,-50%) scale(1)",opacity:1},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(0)`,opacity:0}
    ],{duration:600+Math.random()*200,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>p.remove();
  }
}

/* ===================== 计时 / Toast ===================== */
function startTimer(){
  if(started) return; started=true;
  timer=setInterval(()=>{seconds++;$("time").textContent=fmt(seconds);},1000);
}
function stopTimer(){clearInterval(timer);timer=null;}
function fmt(s){const m=String(Math.floor(s/60)).padStart(2,"0");const ss=String(s%60).padStart(2,"0");return m+":"+ss;}
let toastT=null;
function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1500);
}

/* ===================== 流程：开始 / 胜负 ===================== */
function startGame(idx){
  curLevel=idx;
  state=buildLevel(idx);
  state.moves=0;
  history=[];
  props={hint:3,undo:3,shuffle:1,takeout:1};
  seconds=0;started=false;stopTimer();
  $("time").textContent="00:00";$("moves").textContent="0";
  $("lvlName").textContent=LEVELS[idx].name;
  updateBadges();
  renderBoard();renderSlots();
  hideAll();
}
function win(){
  stopTimer();sfx.win();
  // 解锁下一关
  const unlocked=getUnlocked();
  if(curLevel+1>unlocked && curLevel+1<LEVELS.length) setUnlocked(curLevel+1);
  $("endIcon").textContent="🏆";
  $("endTitle").textContent="通关啦！";
  $("endSub").innerHTML=`用时 <b>${fmt(seconds)}</b> · 共 <b>${state.moves}</b> 步<br>三羊开泰，吉祥如意！`;
  $("nextBtn").style.display = (curLevel+1<LEVELS.length)?"block":"none";
  confettiBurst();
  show("endScreen");
}
function lose(){
  stopTimer();sfx.lose();
  $("endIcon").textContent="😵";
  $("endTitle").textContent="槽位满了！";
  $("endSub").innerHTML=`再接再厉～试试道具<br>用时 ${fmt(seconds)} · ${state.moves} 步`;
  $("nextBtn").style.display="none";
  show("endScreen");
}
function confettiBurst(){
  const colors=["🎉","🎊","⭐","🐑","✨","🌟"];
  for(let i=0;i<26;i++){
    const p=document.createElement("div");
    p.className="pt";p.textContent=colors[i%colors.length];
    p.style.left=(Math.random()*100)+"%";p.style.top="-10px";p.style.fontSize=(16+Math.random()*14)+"px";
    fxEl.appendChild(p);
    p.animate([
      {transform:"translateY(0) rotate(0)",opacity:1},
      {transform:`translateY(${$("app").clientHeight}px) rotate(${Math.random()*720-360}deg)`,opacity:.2}
    ],{duration:1800+Math.random()*1200,easing:"ease-in"}).onfinish=()=>p.remove();
  }
}

/* ===================== 进度保存 ===================== */
function getUnlocked(){return parseInt(localStorage.getItem("syktUnlocked")||"0",10);}
function setUnlocked(n){localStorage.setItem("syktUnlocked",String(n));}

/* ===================== 关卡选择 UI ===================== */
function buildLevelGrid(){
  const grid=$("levelGrid");grid.innerHTML="";
  const unlocked=getUnlocked();
  LEVELS.forEach((lv,i)=>{
    const b=document.createElement("button");
    b.className="lvlBtn"+(i>unlocked?" locked":"");
    b.innerHTML=`<small>关</small>${i+1}`+(i>unlocked?'<span class="lock">🔒</span>':"");
    if(i<=unlocked) b.onclick=()=>startGame(i);
    grid.appendChild(b);
  });
}

/* ===================== 模拟广告弹窗 ===================== */
function showAd(cb){
  const ov=document.createElement("div");
  ov.className="overlay";ov.style.zIndex=2000;
  ov.innerHTML=`<div class="panel"><div class="big">📺</div><h1 style="font-size:22px;">观看广告</h1>
    <div class="sub" id="adCount">广告播放中… 3</div>
    <button class="btn ghost" id="adSkip" disabled style="opacity:.5;">请稍候…</button></div>`;
  $("app").appendChild(ov);
  let n=3;const ac=ov.querySelector("#adCount");
  const itv=setInterval(()=>{n--;ac.textContent="广告播放中… "+n;
    if(n<=0){clearInterval(itv);ac.textContent="广告结束！";
      const sk=ov.querySelector("#adSkip");sk.disabled=false;sk.style.opacity=1;sk.textContent="领取奖励 🎁";
      sk.onclick=()=>{ov.remove();cb&&cb();};}
  },700);
}

/* ===================== 覆盖层切换 ===================== */
function show(id){$(id).classList.remove("hidden");}
function hide(id){$(id).classList.add("hidden");}
function hideAll(){["startScreen","levelScreen","endScreen"].forEach(hide);}

/* ===================== 事件绑定 ===================== */
$("playBtn").onclick=()=>startGame(getUnlocked());
$("selectBtn").onclick=()=>{buildLevelGrid();hide("startScreen");show("levelScreen");};
$("backBtn").onclick=()=>{hide("levelScreen");show("startScreen");};
$("homeBtn").onclick=()=>{hide("endScreen");buildLevelGrid();show("levelScreen");};
$("retryBtn").onclick=()=>startGame(curLevel);
$("nextBtn").onclick=()=>startGame(Math.min(curLevel+1,LEVELS.length-1));
$("shareBtn").onclick=()=>{
  const txt=`我在《三羊开泰》${LEVELS[curLevel].name} 用 ${fmt(seconds)}、${state.moves}步通关啦！🐑 一起来玩~`;
  if(navigator.share){navigator.share({title:"三羊开泰",text:txt}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast("成绩已复制，去分享吧！📋"));}
  else toast(txt);
};
$("muteBtn").onclick=()=>{muted=!muted;$("muteBtn").textContent=muted?"🔇":"🔊";};
document.querySelectorAll(".prop").forEach(btn=>{
  btn.onclick=()=>{
    const p=btn.dataset.prop;
    if(p==="hint")doHint();
    else if(p==="undo")doUndo();
    else if(p==="shuffle")doShuffle();
    else if(p==="takeout")doTakeout();
  };
});
// 防止移动端双击缩放
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});

updateBadges();
</script>
</body>
